databaseChangeLog:
  - changeSet:
      id: 003-create-transactions
      author: sultanzhusupbekov
      changes:
        - createSequence:
            sequenceName: transactions_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: source_card_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: target_card_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: source_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transactions_source
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: target_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transactions_target
            onDelete: RESTRICT

        - createIndex:
            tableName: transactions
            indexName: idx_transactions_source
            columns:
              - column:
                  name: source_card_id

        - createIndex:
            tableName: transactions
            indexName: idx_transactions_target
            columns:
              - column:
                  name: target_card_id

      rollback:
        - dropTable:
            tableName: transactions